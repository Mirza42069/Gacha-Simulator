<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Switcher</title>
</head>
<body>
    <img height="800px" id="bannerImage"/><br />

    <button onclick="changeImage('bekas kopi.png')">Image 1</button>
    <button onclick="changeImage('mage x.png')">Image 2</button>
    <button onclick="changeImage('samsung tab.png')">Image 3</button>
    <button onclick="changeImage('motor ilang.png')">Image 4</button>

    <script>
        function changeImage(fileName) {
            let img = document.querySelector("#bannerImage");
            img.setAttribute("src", fileName);
        }
    </script>
</body>
</html>
