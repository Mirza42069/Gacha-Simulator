<!DOCTYPE html>
   <html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!--=============== CSS ===============-->
      <link rel="stylesheet" href="Card.css">

      <title>Landscape responsive card - Bedimcode</title>
   </head>
   <body>
      <div class="container">
         <div class="card__container">
            <article class="card__article">
               <img src="mage x.png" alt="image" class="card__img">

               <div class="card__data">
                  <span class="card__description">⭐⭐</span>
                  <h2 class="card__title">Mage X</h2>
               </div>
            </article>

            <article class="card__article">
               <img src="stnk.png" alt="image" class="card__img">

               <div class="card__data">
                  <span class="card__description">⭐⭐</span>
                  <h2 class="card__title">STNK 52</h2>
               </div>
            </article>

            <article class="card__article">
               <img src="samsung tab.png" alt="image" class="card__img">

               <div class="card__data">
                  <span class="card__description">⭐⭐</span>
                  <h2 class="card__title">Samsung Tab</h2>
               </div>
            </article>
         </div>
      </div>
   </body>
</html>
