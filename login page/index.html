<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login | Thick Of It</title>
</head>
    
<body>
    
    <div class="login-box">
        <div class="login-header">
            <header>Login</header>
        </div>
        
        <div class="input-box">
            <input type="text" class="input-field" placeholder="NRP" autocomplete="off" required>
        </div>
        
        <div class="input-box">
            <input type="password" class="input-field" placeholder="Password" autocomplete="off" required>
        </div>
        
        <div class="forgot">
            <section>
                <input type="checkbox" id="check">
                <label for="check">Remember me</label>
            </section>
        </div>
        
        <div class="input-submit">
            <button class="submit-btn" id="submit"></button>
            <label for="submit">Sign In</label>
        </div>
        
        <div class="guest-link" style="text-align: center;">
            <p>Don't have account? 
                <a href="https://youtu.be/At8v_Yc044Y?si=nfJPavQtUSb9jcVk" target="_blank">
                    Join as a Guest
                </a>
            </p>
        </div>
        
    </div>

    <script src="index.js">
    </script>
</body>
</html>
